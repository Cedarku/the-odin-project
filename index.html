<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors!</title>
</head>
<body>
    <button class="btnRock">Rock</button>
    <button class="btnPaper">Paper</button>
    <button class="btnScissors">Scissors</button>
        <table id="display">
            <tr>
                <th>You</th>
                <th> | </th>
                <th>Computer</th>
            </tr>
            <tr>
                <td id="playerChoice"></td>
                <td>VS</td>
                <td id="computerChoice"></td>
            </tr>
            <tr>
                <td id="roundResult"></td>
            </tr>
            <tr>
                <td>Results:</td>
            </tr>
            <tr>
                <td id="playerScore">0</td>
                <td> | </td>
                <td id="computerScore">0</td>
            </tr>
        </table>
    <script src="script.js"></script>
</body>
</html>
