<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div class="menu">
            <button class="btnSize">Grid size</button>
            <div class="rainbowSwitch">
                <label class="switch">
                    <input type="checkbox" id="rainbowMode">
                    <span class="slider"></span>
                </label>
                <span>🌈</span>
            </div>
        </div>
        <div class="grid"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
