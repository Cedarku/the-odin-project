<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="./styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Cherry+Bomb+One&display=swap" rel="stylesheet">
  
  <script src="https://kit.fontawesome.com/ef26cee6e4.js" crossorigin="anonymous"></script>

  <title>Calculadora Ranita Kawaii 🐸</title>
</head>
<body>

  <main class="frog-calculator-wrapper">
    <div class="frog-eyes">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>

    <div class="calculator">
      
      <div class="screen-row">
        <div class="cheek left-cheek"></div>
        
        <div class="display-container">
          <div id="display" class="display">0</div>
        </div>
        
        <div class="cheek right-cheek"></div>
      </div>

      <div class="buttons-grid">
        <button id="clear" class="btn btn-danger span-two">AC</button>
        <button id="backspace" class="btn btn-utility">C</button>
        <button class="btn btn-operator" data-operator="÷">÷</button>

        <button class="btn btn-number" data-number="7">7</button>
        <button class="btn btn-number" data-number="8">8</button>
        <button class="btn btn-number" data-number="9">9</button>
        <button class="btn btn-operator" data-operator="*">×</button>

        <button class="btn btn-number" data-number="4">4</button>
        <button class="btn btn-number" data-number="5">5</button>
        <button class="btn btn-number" data-number="6">6</button>
        <button class="btn btn-operator" data-operator="-">-</button>

        <button class="btn btn-number" data-number="1">1</button>
        <button class="btn btn-number" data-number="2">2</button>
        <button class="btn btn-number" data-number="3">3</button>
        <button class="btn btn-operator" data-operator="+">+</button>

        <button class="btn btn-number" data-number="0">0</button>
        <button id="decimal" class="btn btn-number" data-number=".">.</button>
        <button id="equals" class="btn btn-equals span-two">=</button>
      </div>

    </div>
  </main>

  <footer>
    <p>The Odin Project <a href="https://github.com/Cedarku"><i class="fa-brands fa-github"></i></a> Cedarku 2026</p>
  </footer>

  <script src="./scripts/main.js" type="module"></script>
</body>
</html>
