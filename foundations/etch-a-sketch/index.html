<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://kit.fontawesome.com/ef26cee6e4.js" crossorigin="anonymous"></script>

    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div class="container">
        <h1>Etch-a-Sketch</h1>
        <div class="menu">
            <button class="btnSize">Grid size</button>
            <div class="rainbowSwitch">
                <label class="switch">
                    <input type="checkbox" id="rainbowMode">
                    <span class="slider"></span>
                </label>
                <span>🌈</span>
            </div>
        </div>
        <div class="grid"></div>
    </div>

    <footer>
        <p>The Odin Project <a href="https://github.com/Cedarku"><i class="fa-brands fa-github"></i></a> Cedarku 2026</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
