<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://kit.fontawesome.com/ef26cee6e4.js" crossorigin="anonymous"></script>

    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div class="container">
        <h1>Etch-a-Sketch</h1>
        <div class="main">
            <div class="menu">
                <div class="menu-left">
                    <button class="btnSize">Grid size</button>
                    <button class="btnSize" id="btn-clear">Clear</button>
                </div>
                <div class="menu-right">
                    <span class="rainbow-text" id="rainbow-text">Rainbow<br>mode!</span>
                    <div class="rainbow-wrapper">
                        <label class="switch">
                            <input type="checkbox" id="rainbow-toggle">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <span class="rainbow-icon">🌈</span>
                </div>
            </div>
            <div class="grid"></div>
            <dialog id="grid-modal">
                <form method="dialog" id="grid-form">
                    <h3>Grid Size</h3>
                    <label for="grid-size-input">Enter the number of squares per side (1-100):</label>
                    <input type="number" id="grid-size-input" min="1" max="100" placeholder="16" required>
                    <div class="modal-buttons">
                    <button type="button" id="cancel-btn" class="btn-cancel">Cancel</button>
                    <button type="submit" id="confirm-btn" class="btn-confirm">Confirm</button>
                    </div>
                </form>
            </dialog>
        </div>
        <footer>
            <p>The Odin Project <a href="https://github.com/Cedarku"><i class="fa-brands fa-github"></i></a> Cedarku 2026</p>
        </footer>
    </div>

    <script src="./script.js"></script>
</body>
</html>
